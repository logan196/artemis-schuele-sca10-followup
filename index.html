<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Artemis Biolabs · Private portal</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 40%,#123F48 0%,#0B1F2A 62%);color:#E4EEF0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
form{width:min(380px,100%);text-align:center}
svg{width:84px;height:88px;filter:drop-shadow(0 0 6px rgba(127,184,190,.45))}
h1{font:500 26px/1.2 "Source Serif 4",Georgia,serif;margin:18px 0 6px;color:#fff}
p{color:#9FC3C8;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 26px}
input{width:100%;box-sizing:border-box;background:rgba(10,24,30,.7);border:1px solid rgba(159,195,200,.4);border-radius:999px;color:#fff;font-size:16px;padding:12px 18px;outline:none;text-align:center}
input:focus{border-color:#CFE4E6}
button{margin-top:12px;width:100%;background:#3cc0ad;border:0;border-radius:999px;color:#06201c;font:600 15px Inter,system-ui,sans-serif;padding:12px;cursor:pointer}

.err{color:#f2a3b3;font-size:13px;min-height:18px;margin-top:12px;letter-spacing:0;text-transform:none}
</style></head><body><div class="w"><form id="f" autocomplete="off">
<svg viewBox="-17 -18 34 36" aria-hidden="true" fill="none" stroke="#7FB8BE" stroke-width=".6" stroke-linejoin="round"><path d="M0.68 -15.9L10.8 -10.83L14.54 -5.7L15 5.7L11.48 7.6L7.48 10.83L1.81 13.92L-0.68 15.9L-10.8 10.83L-14.54 5.7L-15 -5.7L-11.48 -7.6L-7.48 -10.83L-1.81 -13.92Z"/><path d="M-8.9 2.61L2.38 2.61L6.77 -7.6L-1.81 -13.92L-11.48 -7.6Z" stroke="#3E7F87"/></svg>
<h1>Private portal</h1><p>Prepared by Artemis Biolabs</p>
<input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus required>
<button id="go" type="submit">Open the portal</button><div class="err" id="err" role="alert"></div></form></div>
<script>
(function(){
var K='artemis_sca10_key_a57f66546dc1';
function b2a(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)))}
function a2b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open_(rawKey){
 var buf=new Uint8Array(await (await fetch('payload.bin?v=a57f66546dc1',{cache:'force-cache'})).arrayBuffer());
 var iv=buf.slice(16,28),ct=buf.slice(28),key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
 var html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
 document.open();document.write(html);document.close();}
async function derive(pw){
 var buf=new Uint8Array(await (await fetch('payload.bin?v=a57f66546dc1',{cache:'force-cache'})).arrayBuffer());
 var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return await crypto.subtle.deriveBits({name:'PBKDF2',salt:buf.slice(0,16),iterations:600000,hash:'SHA-256'},base,256);}
var saved=null;try{saved=sessionStorage.getItem(K)}catch(e){}
if(saved){open_(a2b(saved)).catch(function(){try{sessionStorage.removeItem(K)}catch(e){}})}
document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();var b=document.getElementById('go'),er=document.getElementById('err');
 b.disabled=true;b.textContent='Unlocking...';er.textContent='';
 try{var k=await derive(document.getElementById('pw').value);await open_(k);try{sessionStorage.setItem(K,b2a(k))}catch(x){}}
 catch(x){er.textContent='That password did not work. Please try again.';b.disabled=false;b.textContent='Open the portal'}});
})();
</script></body></html>
